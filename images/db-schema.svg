<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .box { fill:#ffffff; stroke:#333; stroke-width:1.5; rx:6; }
    .title { font: bold 14px/1.2 Arial, Helvetica, sans-serif; }
    .field { font: 12px/1.2 Arial, Helvetica, sans-serif; fill:#222; }
    .fk { fill:#555; font-style:italic; }
    .edge { stroke:#666; stroke-width:1.2; fill:none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" />
    </marker>
  </defs>

  <!-- User -->
  <g transform="translate(40,40)">
    <rect class="box" width="220" height="130"></rect>
    <text x="12" y="26" class="title">User</text>
    <text x="12" y="48" class="field">id (PK)</text>
    <text x="12" y="64" class="field">name</text>
    <text x="12" y="80" class="field">email</text>
    <text x="12" y="96" class="field">password</text>
    <text x="12" y="112" class="field">deletedAt</text>
  </g>

  <!-- Role -->
  <g transform="translate(300,40)">
    <rect class="box" width="180" height="80"></rect>
    <text x="12" y="26" class="title">Role</text>
    <text x="12" y="48" class="field">id (PK)</text>
    <text x="12" y="64" class="field">name</text>
  </g>

  <!-- Project -->
  <g transform="translate(40,200)">
    <rect class="box" width="260" height="120"></rect>
    <text x="12" y="26" class="title">Project</text>
    <text x="12" y="48" class="field">id (PK)</text>
    <text x="12" y="64" class="field">title</text>
    <text x="12" y="80" class="field">description</text>
    <text x="12" y="96" class="field">createdBy (FK → User.id)</text>
  </g>

  <!-- ProjectUser -->
  <g transform="translate(340,200)">
    <rect class="box" width="200" height="90"></rect>
    <text x="12" y="26" class="title">ProjectUser</text>
    <text x="12" y="48" class="field">id (PK)</text>
    <text x="12" y="64" class="field">projectId (FK)</text>
    <text x="12" y="80" class="field">userId (FK)</text>
  </g>

  <!-- Ticket -->
  <g transform="translate(40,360)">
    <rect class="box" width="360" height="160"></rect>
    <text x="12" y="26" class="title">Ticket</text>
    <text x="12" y="48" class="field">id (PK)</text>
    <text x="12" y="64" class="field">title</text>
    <text x="12" y="80" class="field">description</text>
    <text x="12" y="96" class="field">status</text>
    <text x="12" y="112" class="field">severity</text>
    <text x="12" y="128" class="field">projectId (FK)</text>
    <text x="12" y="144" class="field">assignedTo (FK → User.id)</text>
  </g>

  <!-- Comment -->
  <g transform="translate(440,360)">
    <rect class="box" width="220" height="100"></rect>
    <text x="12" y="26" class="title">Comment</text>
    <text x="12" y="48" class="field">id (PK)</text>
    <text x="12" y="64" class="field">content</text>
    <text x="12" y="80" class="field">createdBy (FK → User.id)</text>
    <text x="12" y="96" class="field">ticketId (FK)</text>
  </g>

  <!-- Attachment -->
  <g transform="translate(440,480)">
    <rect class="box" width="220" height="80"></rect>
    <text x="12" y="26" class="title">Attachment</text>
    <text x="12" y="48" class="field">id (PK)</text>
    <text x="12" y="64" class="field">fileUrl</text>
    <text x="12" y="80" class="field">ticketId (FK)</text>
  </g>

  <!-- Notification -->
  <g transform="translate(700,360)">
    <rect class="box" width="220" height="80"></rect>
    <text x="12" y="26" class="title">Notification</text>
    <text x="12" y="48" class="field">id (PK)</text>
    <text x="12" y="64" class="field">ticketId (FK)</text>
  </g>

  <!-- ActivityLog -->
  <g transform="translate(700,480)">
    <rect class="box" width="220" height="80"></rect>
    <text x="12" y="26" class="title">ActivityLog</text>
    <text x="12" y="48" class="field">id (PK)</text>
    <text x="12" y="64" class="field">projectId (FK)</text>
  </g>

  <!-- Edges -->
  <path class="edge" d="M220,80 L300,80" />
  <path class="edge" d="M160,160 L160,200 L400,200" />
  <path class="edge" d="M200,320 L200,360" />
  <path class="edge" d="M360,250 L360,200" />
  <path class="edge" d="M200,440 L440,420" />
  <path class="edge" d="M380,420 L440,380" />
  <path class="edge" d="M540,420 L700,420" />
  <path class="edge" d="M760,460 L760,480" />

</svg>
